<!doctype html>
<html lang="en" data-theme="matrix">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<title>E2E CONTROL</title>
		<script>
			// Apply the saved theme before first paint (src/theme.ts owns the key).
			try {
				var t = localStorage.getItem("e2e-theme");
				if (["matrix", "retro", "futuristic", "minimal"].indexOf(t) !== -1) document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Exo+2:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;700&family=Righteous&family=Share+Tech+Mono&family=Work+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
