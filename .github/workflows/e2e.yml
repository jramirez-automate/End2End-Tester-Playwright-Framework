name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_env:
        description: Environment to test
        required: true
        default: demo
        type: choice
        options:
          - demo
          - dev
          - staging
          - prod
      ticket:
        description: Optional ticket key, to run one tag and capture evidence
        required: false
        type: string

jobs:
  # Runs on every push and pull request. Needs no secrets: the demo environment
  # targets public sample apps.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:tool-sync
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  # Your own environments, started by hand from the Actions tab.
  test:
    if: github.event_name == 'workflow_dispatch' && inputs.test_env != 'demo'
    runs-on: ubuntu-latest
    env:
      CI: true
      TEST_ENV: ${{ inputs.test_env }}
      TICKET: ${{ inputs.ticket }}
      EVIDENCE: ${{ inputs.ticket != '' }}
      BASE_URL: ${{ secrets.BASE_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_SITE_NAME: ${{ secrets.E2E_SITE_NAME }}
      E2E_LOGIN_PATH: ${{ secrets.E2E_LOGIN_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ inputs.test_env }}
          path: |
            evidence/
            playwright-report/
          retention-days: 14
